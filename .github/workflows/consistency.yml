name: consistency

on:
  push:
    paths:
      - "wiki/**"
      - "raw/**"
      - "prompts/**"
      - ".claude/Docs/**"
      - ".claude/skills/**"
      - ".claude/commands/**"
      - ".agent/workflows/**"
      - "scripts/check-consistency.sh"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/consistency.yml"
  pull_request:
    paths:
      - "wiki/**"
      - "raw/**"
      - "prompts/**"
      - ".claude/Docs/**"
      - ".claude/skills/**"
      - ".claude/commands/**"
      - ".agent/workflows/**"
      - "scripts/check-consistency.sh"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/consistency.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run consistency check
        run: bash scripts/check-consistency.sh
